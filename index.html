<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="English Play">
<title>English Play — ฝึกอังกฤษครอบครัว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#111827;--mut:#6b7280;--line:#e5e7eb;--soft:#f6f7f9;--acc:#2563eb;--accs:#eff4ff;--ok:#15803d;--oks:#ecfdf3;--bad:#b91c1c;--bads:#fef2f2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding:20px 18px 96px}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600;margin:24px 0 10px}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.card{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:12px;padding:13px 18px;font-weight:600;border:1px solid var(--line);background:#fff}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.full{width:100%}
.btn.danger{color:var(--bad);border-color:#f3c4c4}
.btn:disabled{opacity:.45;cursor:default}
.link{font-size:14px;color:var(--mut);text-decoration:underline}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--mut)}
.chip.acc{background:var(--accs);color:var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.game{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;min-height:112px;display:flex;flex-direction:column;gap:4px;background:#fff;transition:border-color .15s}
.game:not(:disabled):hover{border-color:var(--acc)}
.game .ic{font-size:22px;line-height:1}
.game b{font-weight:600}
.game:disabled{background:var(--soft);cursor:default}
.skill{font-size:13px;font-weight:600;color:var(--mut);margin:18px 0 8px;letter-spacing:.02em}
.banner{background:var(--accs);border-radius:14px;padding:16px;margin-top:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{padding:10px 0 12px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .i{font-size:20px;line-height:1.1}
nav.tabs button.on{color:var(--acc);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{padding:9px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px}
.seg button.on{border-color:var(--acc);background:var(--accs);color:var(--acc);font-weight:600}
.field{margin-top:18px}.field>label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:18px}
.prog{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;flex:1;margin:0 12px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.timer{height:3px;background:var(--soft);border-radius:3px;overflow:hidden;margin:10px 0 0}
.timer i{display:block;height:100%;background:var(--fg);transition:width .2s linear}
.q{font-size:20px;font-weight:500;line-height:1.55;margin:18px 0 20px}
.q .gap{display:inline-block;min-width:64px;border-bottom:2px solid var(--fg);text-align:center;color:var(--acc);font-weight:600}
.word{text-align:center;margin:26px 0 22px}
.word .w{font-size:34px;font-weight:700;letter-spacing:-.01em}
.word .th{font-size:26px;font-weight:600}
.spk{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--accs);color:var(--acc);font-size:18px;margin-top:8px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#fff;font-size:16px}
.opt .k{flex:none;width:26px;height:26px;border-radius:8px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.opt.ok{border-color:var(--ok);background:var(--oks)}.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bads)}.opt.bad .k{background:var(--bad);color:#fff}
.opt.pick{border-color:var(--acc);background:var(--accs)}
.exp{border-radius:12px;padding:14px;margin-top:6px;font-size:15px}
.exp.ok{background:var(--oks)}.exp.bad{background:var(--bads)}
.listen{display:flex;flex-direction:column;align-items:center;gap:10px;padding:26px 16px;border:1px solid var(--line);border-radius:14px;margin:16px 0}
.play{width:72px;height:72px;border-radius:50%;background:var(--acc);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center}
.foot{position:sticky;bottom:0;background:linear-gradient(transparent,#fff 30%);padding-top:18px;padding-bottom:12px}
.big{font-size:44px;font-weight:700;letter-spacing:-.02em}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat .card{text-align:center;padding:12px 8px}
.stat b{display:block;font-size:20px}
.list>*{border-top:1px solid var(--line);padding:12px 0}.list>*:first-child{border-top:0}
.av{width:44px;height:44px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border:1px solid var(--line);border-radius:14px;background:#fff}
.prof .av{width:64px;height:64px;font-size:32px}
input[type=text],input[type=email],input[type=password]{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fff}
input:focus{border-color:var(--acc)}
.emojis{display:flex;flex-wrap:wrap;gap:8px}
.emojis button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);font-size:24px}
.emojis button.on{border-color:var(--acc);background:var(--accs)}
.bar{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw;text-align:center}
.lvl{font-size:12px;color:var(--mut);margin-top:2px}
.dots{display:flex;justify-content:center;gap:16px;margin:26px 0 8px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--fg)}
.dots i.f{background:var(--fg)}
.dots.err i{border-color:var(--bad)}.dots.err i.f{background:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center;margin-top:22px}
.pad button{height:72px;border-radius:50%;font-size:26px;font-weight:500;background:var(--soft)}
.pad button.e{background:none}
.err{color:var(--bad);font-size:14px;text-align:center;min-height:21px}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--mut)}
.tr{margin-top:12px;font-size:15px;line-height:1.6;width:100%}.tr div{margin-top:4px}
.doc{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fcfcfd;margin-top:14px;max-height:48vh;overflow:auto}
.dh{white-space:pre-wrap;font-size:13px;color:var(--mut);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:8px}
.db{white-space:pre-wrap;font-size:15px;line-height:1.65}
.bub{max-width:86%;width:fit-content;padding:10px 14px;border-radius:16px;margin:8px 0;font-size:15px;line-height:1.5}
.bub.npc{background:var(--soft);border-bottom-left-radius:4px}
.bub.me{background:var(--acc);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.goal{background:#fff8e6;border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0}
.mic{width:80px;height:80px;border-radius:50%;background:var(--acc);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;margin:8px auto}
.mic.on{background:var(--bad);animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.07)}}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.tile.used{visibility:hidden}
.ansbox{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:flex-start}
.ansbox .tile{border-color:var(--acc);background:var(--accs)}
.w-hit{color:var(--ok)}.w-miss{color:var(--bad);text-decoration:underline}
.sent{font-size:20px;line-height:1.6;font-weight:500}
.ta{font:inherit;width:100%;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;outline:none;resize:vertical;font-size:17px}
.ta:focus{border-color:var(--acc)}
input.ok{border-color:var(--ok);background:var(--oks)}input.bad{border-color:var(--bad);background:var(--bads)}
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden><div class="in">
<button data-t="play"><span class="i">▶</span>เล่น</button>
<button data-t="review"><span class="i">↻</span>ทบทวน</button>
<button data-t="exam"><span class="i">⏱</span>ข้อสอบ</button>
<button data-t="family"><span class="i">⌂</span>ครอบครัว</button>
<button data-t="me"><span class="i">○</span>ฉัน</button>
</div></nav>
<script>
// Format: [level, topic, prompt, correct, wrong1, wrong2, (wrong3), explanation]
// Correct answer is always listed first; options are shuffled at runtime.
const P5 = [
// ===== Level 1 (400–545) =====
[1,"office","She ___ to work by bus every day.","goes","go","going","gone","ประธาน She เป็นเอกพจน์ + every day (ทำเป็นประจำ) → Present Simple เติม -es: goes"],
[1,"office","The meeting will start ___ 9 a.m.","at","in","on","by","บอกเวลาแบบเจาะจง (นาฬิกา) ใช้ at"],
[1,"office","Please ___ your name on this form.","write","writes","writing","wrote","ประโยคคำสั่ง/ขอร้องขึ้นต้นด้วย Please + V1 ไม่ผัน"],
[1,"office","We have ___ important meeting this afternoon.","an","a","any","many","important ขึ้นต้นด้วยเสียงสระ → ใช้ an; meeting เป็นนามเอกพจน์จึงใช้ many/any ไม่ได้"],
[1,"shopping","The store is open ___ Monday to Saturday.","from","at","since","during","รูปแบบ from ... to ... = ตั้งแต่ ... ถึง ..."],
[1,"daily","I ___ my keys yesterday.","lost","lose","losing","loses","yesterday = อดีต → Past Simple: lost"],
[1,"office","There are ___ chairs in the room.","many","much","a little","every","chairs นับได้ พหูพจน์ → many (much/a little ใช้กับนามนับไม่ได้)"],
[1,"daily","Mr. Kim is ___ than his brother.","taller","tall","tallest","more tall","มี than → ขั้นกว่า; คำสั้นพยางค์เดียวเติม -er: taller"],
[1,"daily","Can you help ___ with this box?","me","I","my","mine","หลังกริยา help ต้องใช้สรรพนามกรรม: me"],
[1,"travel","The train ___ at 6:30 every morning.","leaves","leave","leaving","is leave","ตารางเวลาประจำ + ประธานเอกพจน์ → leaves"],
[1,"office","Our office is ___ the second floor.","on","in","at","under","ชั้นของอาคารใช้ on: on the second floor"],
[1,"daily","They ___ watching TV right now.","are","is","be","am","right now → Present Continuous; ประธาน They ใช้ are"],
[1,"office","Please turn ___ the lights when you leave.","off","of","from","away","turn off = ปิด (ไฟ/เครื่องใช้ไฟฟ้า)"],
[1,"shopping","How ___ does this shirt cost?","much","many","long","often","ถามราคาใช้ How much"],
[1,"daily","I usually drink coffee ___ the morning.","in","on","at","by","ช่วงเวลาของวัน: in the morning/afternoon/evening"],
[1,"dining","This is ___ restaurant in town.","the best","better","good","more good","เปรียบเทียบกับทุกร้านในเมือง (in town) → ขั้นสุด the best"],
[1,"office","She has worked here ___ 2020.","since","for","from","at","Present Perfect + จุดเริ่มต้นของเวลา (ปี 2020) → since"],
[1,"dining","We ___ dinner at 7 last night.","had","have","has","having","last night = อดีต → had"],
[1,"travel","Excuse me, ___ is the restroom?","where","what","who","when","ถามสถานที่ใช้ where"],
[1,"tech","My phone is not working. I need a ___ one.","new","news","newly","newness","หน้า one (แทนคำนาม) ต้องใช้คำคุณศัพท์: new"],
[1,"finance","The bank closes ___ 4 p.m. on weekdays.","at","in","on","for","เวลาเจาะจงใช้ at"],
[1,"dining","Do you ___ a reservation?","have","has","having","had","หลัง Do + ประธาน ใช้ V1 เสมอ: have"],
[1,"health","Please wait ___ I call your name.","until","during","for","between","until = จนกระทั่ง ตามด้วยประโยคได้; during/for ตามด้วยคำนาม"],
[1,"daily","He is very ___ at playing tennis.","good","well","goodly","better","be good at = เก่งเรื่อง...; หลัง be ใช้คุณศัพท์ good (well เป็นกริยาวิเศษณ์)"],
[1,"daily","The boxes are too ___ for me to carry.","heavy","heavily","heaviness","heavier","too + คุณศัพท์ + to V: too heavy to carry"],
// ===== Level 2 (550–695) =====
[2,"tech","The new software is ___ than the old version.","more efficient","efficient","most efficient","efficiently","มี than → ขั้นกว่า; คำยาวใช้ more + adj"],
[2,"hr","All employees must ___ their ID cards at all times.","wear","wears","wearing","wore","หลัง modal (must) ใช้ V1 เสมอ"],
[2,"shopping","The package was delivered ___ the customer's address.","to","for","from","by","deliver something to + สถานที่ = ส่งไปที่..."],
[2,"daily","If it rains tomorrow, the picnic ___ cancelled.","will be","was","has been","would have been","If แบบที่ 1 (เป็นไปได้จริง): If + Present, will + V1"],
[2,"office","Ms. Park has been working on the project ___ three months.","for","since","during","at","ระยะเวลา (three months) ใช้ for; since ใช้กับจุดเริ่มต้น"],
[2,"office","The manager asked us ___ the report by Friday.","to finish","finish","finishing","finished","ask + คน + to V = ขอให้ใครทำอะไร"],
[2,"office","Please read the instructions ___ before using the machine.","carefully","careful","care","caring","ขยายกริยา read ต้องใช้กริยาวิเศษณ์ (-ly)"],
[2,"travel","The hotel offers free breakfast to ___ guests.","its","it's","it","itself","ต้องการคำแสดงความเป็นเจ้าของของ hotel (เอกพจน์) → its; it's = it is"],
[2,"office","The conference room is ___ for the whole afternoon.","reserved","reserve","reserving","reservation","ห้องถูกจอง → Passive: is + V3 (reserved)"],
[2,"office","Neither the manager ___ the assistant was available.","nor","or","and","but","คู่คำเชื่อม neither ... nor"],
[2,"office","We need to ___ the meeting to next Tuesday.","postpone","prevent","pretend","propose","postpone ... to ... = เลื่อนออกไปเป็น..."],
[2,"travel","The flight was delayed ___ bad weather.","due to","because","although","despite","ตามด้วยคำนาม (bad weather) และบอกสาเหตุ → due to; because ต้องตามด้วยประโยค"],
[2,"hr","Mr. Chen is responsible ___ training new staff.","for","of","to","with","be responsible for = รับผิดชอบ..."],
[2,"shopping","Customers can return items ___ 30 days of purchase.","within","during","until","since","within + ระยะเวลา = ภายใน..."],
[2,"finance","The sales figures ___ every month.","are reviewed","review","reviewing","are reviewing","ตัวเลขไม่สามารถทบทวนเองได้ → Passive: are reviewed"],
[2,"office","I'm looking forward to ___ you at the conference.","seeing","see","saw","be seen","look forward to + V-ing (to ตรงนี้เป็นบุพบท)"],
[2,"dining","The restaurant is so popular that you should book a table in ___.","advance","advanced","advancing","advancement","สำนวน in advance = ล่วงหน้า"],
[2,"hr","Everyone ___ the CEO attended the training.","except","expect","accept","exception","except = ยกเว้น; ระวังคำเสียงคล้าย expect (คาดหวัง), accept (ยอมรับ)"],
[2,"office","The office will be closed ___ the holiday.","during","while","when","between","ตามด้วยคำนาม (the holiday) → during; while/when ตามด้วยประโยค"],
[2,"office","Please contact ___ if you have any questions.","us","we","our","ours","หลังกริยา contact ใช้สรรพนามกรรม: us"],
[2,"travel","This is the ___ expensive hotel we have ever stayed in.","most","more","much","very","the + most + adj = ขั้นสุด (มี ever ยืนยันการเปรียบเทียบสูงสุด)"],
[2,"hr","The new employee seems very ___ in learning.","interested","interesting","interest","interestingly","ความรู้สึกของคน → -ed (interested in); -ing ใช้บรรยายสิ่งที่ทำให้รู้สึก"],
[2,"finance","Our profits increased ___ 15 percent last year.","by","at","on","with","increase by + ตัวเลข = เพิ่มขึ้น (เป็นจำนวน)..."],
[2,"hr","You ___ wear a suit; casual clothes are fine.","don't have to","must","have to","need","don't have to = ไม่จำเป็นต้อง (ประโยคหลังบอกว่าใส่ชุดสบายๆ ได้)"],
[2,"office","The printer on the third floor is ___ order.","out of","out","off","without","สำนวน out of order = เสีย ใช้การไม่ได้"],
// ===== Level 3 (700–845) =====
[3,"office","The board approved the proposal ___ some members had concerns.","although","despite","because of","however","ตามด้วยประโยค + ความหมายขัดแย้ง → although; despite/because of ตามด้วยคำนาม"],
[3,"hr","Applicants must submit their résumés no later ___ May 15.","than","then","from","by","สำนวน no later than = ไม่เกิน/ภายใน"],
[3,"office","The marketing team worked ___ to meet the deadline.","diligently","diligent","diligence","more diligent","ขยายกริยา worked → กริยาวิเศษณ์ diligently"],
[3,"travel","Had we known about the delay, we ___ a later flight.","would have booked","would book","will book","had booked","If แบบที่ 3 ละ If แล้วสลับ Had ขึ้นต้น → would have + V3"],
[3,"office","The CEO's speech was so ___ that everyone stayed until the end.","inspiring","inspired","inspire","inspiration","สุนทรพจน์เป็นสิ่งที่ทำให้รู้สึก → -ing (inspiring)"],
[3,"finance","Each department is required to submit ___ budget proposal by the end of the month.","its","their","it","them","Each department เป็นเอกพจน์ → its (ในข้อสอบ TOEIC ยึดตามหลักไวยากรณ์ทางการ)"],
[3,"hr","The new policy will take ___ on January 1.","effect","affect","effective","effectively","สำนวน take effect = มีผลบังคับใช้; affect เป็นกริยา"],
[3,"hr","Ms. Rivera was promoted ___ her outstanding performance.","in recognition of","in spite of","instead of","regardless of","in recognition of = เพื่อเป็นการยกย่อง... (เหตุผลของการเลื่อนตำแหน่ง)"],

function today(d=new Date()){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function weekCorrect(p){let s=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);s+=(p.days[today(d)]||0)}return s}
function streak(p){let n=0;const d=new Date();if(p.days[today(d)]===undefined)d.setDate(d.getDate()-1);while(p.days[today(d)]!==undefined){n++;d.setDate(d.getDate()-1)}return n}
function uid(){try{return crypto.randomUUID()}catch(e){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}}
async function hashPin(id,pin){
  const s='ep:'+id+':'+pin;
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+(h>>>0).toString(16)}
}

function normalize(p){
  p.stats=p.stats||{}; for(const t of ['p5','p2','wd','eav','inb','sh','rp','sb','mt','mm','ts']) p.stats[t]=p.stats[t]||{a:0,c:0};

  p.set=Object.assign({accent:'en-US',rate:1},p.set||{});
  if(p.level===undefined) p.level=null;
  return p;
}
function rowToProfile(r){return normalize(Object.assign({},r.data||{},{id:r.id,name:r.name,emoji:r.emoji,pinHash:r.pin_hash}))}
function profileToRow(p){const {id,name,emoji,pinHash,...data}=p;return {id,name,emoji,pin_hash:pinHash||null,data,updated_at:new Date().toISOString()}}

function loadLocal(){

  try{S.cur=sessionStorage.getItem('ep.cur')}catch(e){}
}
function saveLocal(){try{localStorage.setItem(LKEY,JSON.stringify({profiles:S.profiles}))}catch(e){}}
function setCur(id){S.cur=id;try{id?sessionStorage.setItem('ep.cur',id):sessionStorage.removeItem('ep.cur')}catch(e){}}

let saveTimer=null, dirty=new Set();
function save(p){ // persist one profile (default current)
  p=p||me(); if(!p) return;
  if(!CLOUD){saveLocal();return}
  dirty.add(p.id); clearTimeout(saveTimer); saveTimer=setTimeout(flush,1200);
}
async function flush(){
  if(!CLOUD||!dirty.size) return;
  const rows=[...dirty].map(id=>S.profiles.find(p=>p.id===id)).filter(Boolean).map(profileToRow); dirty.clear();
  const {error}=await sb.from(TABLE).upsert(rows);
  if(error){rows.forEach(r=>dirty.add(r.id));toast('บันทึกข้อมูลไม่สำเร็จ จะลองใหม่อัตโนมัติ');saveTimer=setTimeout(flush,8000)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
async function loadCloud(){

function pickOne(type,level,topic,used){
  const p=me();
  let pool=ALL.filter(q=>q.type===type&&!used.has(q.id));
  if(topic&&topic!=='all'){const t=pool.filter(q=>q.topic===topic);if(t.length)pool=t;}
  const order=[level,level-1,level+1,level-2,level+2,level-3,level+3].filter(l=>l>=1&&l<=4);
  for(const l of order){
    const c=pool.filter(q=>q.level===l);
    if(c.length){
      const w=c.filter(q=>p.wrong[q.id]); if(w.length&&Math.random()<.35) return rnd(w);
      const min=Math.min(...c.map(q=>p.seen[q.id]||0));
      return rnd(c.filter(q=>(p.seen[q.id]||0)===min));
    }
  }
  return null;
}
function pickWord(level,used){
  const p=me(), now=Date.now();
  const pool=ALL.filter(q=>q.type==='wd'&&!used.has(q.id));
  const due=pool.filter(q=>p.vocab[q.id]&&p.vocab[q.id].due<=now).sort((a,b)=>p.vocab[a.id].due-p.vocab[b.id].due);
  // due words of any level first (they were learned already), then new words at the current level
  if(due.length) return due[0];
  const order=[level,level-1,level+1,level-2,level+2,level-3,level+3].filter(l=>l>=1&&l<=4);
  for(const l of order){const n=pool.filter(q=>q.level===l&&!p.vocab[q.id]);if(n.length)return rnd(n)}
  const rest=pool.slice().sort((a,b)=>(p.vocab[a.id]?p.vocab[a.id].due:0)-(p.vocab[b.id]?p.vocab[b.id].due:0));
  return rest[0]||null;
}

const CMAP={};
CONFUSE.forEach(g=>g.forEach(w=>{const k=w.toLowerCase();CMAP[k]=CMAP[k]||new Set();g.forEach(x=>{if(x.toLowerCase()!==k)CMAP[k].add(x)})}));
function phon(w){
  let s=w.toLowerCase().replace(/[^a-z ]/g,'');
  s=s.replace(/tion|sion/g,'shn').replace(/ph/g,'f').replace(/ck/g,'k').replace(/qu/g,'kw').replace(/^wr/,'r').replace(/^kn/,'n')
     .replace(/gh/g,'').replace(/c(?=[eiy])/g,'s').replace(/c/g,'k').replace(/x/g,'ks').replace(/z/g,'s').replace(/y/g,'i')
     .replace(/ee|ea|ie/g,'i').replace(/oo|ou/g,'u').replace(/(.)\1+/g,'$1').replace(/e\b/g,'');
  return s;
}
function lev(a,b){
  const m=a.length,n=b.length; if(!m)return n; if(!n)return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}
  return prev[n];
}
const SA_CACHE={};
function soundAlikes(word){
  const key=word.toLowerCase();
  if(!SA_CACHE[key]){
    const curated=CMAP[key]?[...CMAP[key]]:[];
    const pk=phon(word), scored=[];
    for(const q of ALL){
      if(q.type!=='wd') continue;
      const w=q.word, wl=w.toLowerCase();
      if(wl===key||wl.includes(key)||key.includes(wl)||curated.some(c=>c.toLowerCase()===wl)) continue;
      const qk=phon(w), d=lev(pk,qk)/Math.max(pk.length,qk.length,1);
      if(d<=0.5) scored.push([d+(qk[0]===pk[0]?0:0.15),w]);
    }
    scored.sort((a,b)=>a[0]-b[0]);
    SA_CACHE[key]={c:curated,p:scored.slice(0,4).map(x=>x[1])};
  }
  const e=SA_CACHE[key];
  return [...shuf(e.c),...shuf(e.p)]; // curated sound-alikes first, then closest-sounding words from the bank
}

function vocabDue(p){const now=Date.now();return Object.values(p.vocab).filter(v=>v.due<=now).length}

let G=null, timerInt=null, lastCfg=null;
function clearTimer(){if(timerInt){clearInterval(timerInt);timerInt=null}}
function startGame(cfg){
  const p=me();
  lastCfg=cfg;
  G={...cfg, idx:0, results:[], used:new Set(), curLevel:cfg.level==='auto'?(p.level||1):cfg.level, rw:0, ww:0, answered:false, score:0};
  if(cfg.fixed){G.queue=cfg.fixed.slice();G.count=G.queue.length}
  nextQ(true);
}
function nextQ(first){
  clearTimer(); stopSpeak();
  if(!first) G.idx++;
  if(G.idx>=G.count) return finish();
  let q;
  if(G.queue) q=BANK[G.queue[G.idx]];
  else if(G.mode==='wd') q=pickWord(G.curLevel,G.used);
  else q=pickOne(G.mode,G.curLevel,G.topic,G.used);
  if(!q){G.count=G.idx;return finish()}
  G.used.add(q.id); G.q=q; G.answered=false; G.pick=null; G.showText=G.showText0;
  if(q.type==='wd'){
    const m=G.wdMode==='mix'||!G.wdMode?rnd(['en','th','listen']):G.wdMode; G.wm=m;
    const others=shuf(ALL.filter(x=>x.type==='wd'&&x.id!==q.id&&x.level===q.level&&x.th!==q.th)).slice(0,3);
    if(m==='en'){G.correct=q.th;G.opts=shuf([q.th,...others.map(o=>o.th)])}
    else if(m==='listen'){
      // mix in words that sound close to the target so the learner must listen carefully
      const near=soundAlikes(q.word).slice(0,2);
      const fill=others.map(o=>o.word).filter(w=>!near.includes(w));
      G.correct=q.word;G.opts=shuf([q.word,...near,...fill].slice(0,4));
    }
    else{G.correct=q.word;G.opts=shuf([q.word,...others.map(o=>o.word)])}
  } else {G.correct=q.ans;G.opts=shuf(q.opts)}
  if(G.timer){G.tLeft=G.timer;G.tMax=G.timer}
  renderQ();
  if(q.type==='p2') playP2();
  if(q.type==='mm'&&q.ctx) speak([q.ctx]);
  if(q.type==='eav'&&G.lastSet!==q.set){G.lastSet=q.set;playSet()}
  if(q.type==='wd'&&G.wm!=='th') speak([q.word]);
  if(G.timer){
    timerInt=setInterval(()=>{G.tLeft-=.2;const b=$('#tbar');if(b)b.style.width=Math.max(0,G.tLeft/G.tMax*100)+'%';if(G.tLeft<=0){clearTimer();answer(-1)}},200);
  }
}
function playP2(){
  const L=['A','B','C'];

  if(!ok&&!G.showText){G.showText=true;renderQ();toast('อุปกรณ์นี้ไม่รองรับเสียง จึงแสดงข้อความแทน')}
}
function answer(i){
  if(G.answered) return;
  if(G.mode==='exam'){G.pick=i;renderQ();return}
  G.answered=true; clearTimer();
  const correct=i>=0&&G.opts[i]===G.correct;
  record(G.q,correct,i>=0?G.opts[i]:null);
  if(G.level==='auto'&&G.mode!=='placement'&&G.mode!=='review'){
    if(correct){G.rw++;G.ww=0;if(G.rw>=4&&G.curLevel<4){G.curLevel++;G.rw=0;G.lvMsg='⬆ ระดับขึ้นเป็น '+LV[G.curLevel]}}
    else{G.ww++;G.rw=0;if(G.ww>=2&&G.curLevel>1){G.curLevel--;G.ww=0;G.lvMsg='⬇ ปรับระดับเป็น '+LV[G.curLevel]}}
  }
  if(correct) G.score+=10+(G.timer?Math.round(G.tLeft):0);
  G.pick=i; renderQ();
  if(G.q.type==='wd') speak([G.q.word]);
  if(G.mode==='placement') setTimeout(()=>{if(G&&G.answered)nextQ()},650);
}
function examConfirm(){if(G.pick===null)return;record(G.q,G.opts[G.pick]===G.correct,G.opts[G.pick]);nextQ()}
function record(q,correct,picked){
  const p=me();
  G.results.push({id:q.id,correct,picked});
  p.stats[q.type].a++; if(correct)p.stats[q.type].c++;
  p.seen[q.id]=(p.seen[q.id]||0)+1;
  if(correct) delete p.wrong[q.id]; else p.wrong[q.id]=Date.now();
  if(q.type==='wd'){
    const v=p.vocab[q.id]||{box:0,due:0};
    v.box=correct?Math.min(6,v.box+1):1;
    v.due=Date.now()+(correct?BOXDAYS[v.box]*DAY:10*60000);
    p.vocab[q.id]=v;
  }
  const d=today(); p.days[d]=(p.days[d]||0)+(correct?1:0);
  save(p);
}

function startExam(full){
  const ids=[];
  const pick=(t,l,n)=>shuf(ALL.filter(q=>q.type===t&&q.level===l)).slice(0,n).map(q=>q.id);
  const sets=(arr,l,n)=>shuf(arr.filter(s=>s.l===l)).slice(0,n).flatMap(s=>s.qids);
  if(full){ // listening first (Part 2, Part 3–4), then reading (Part 5, Part 7) — like the real test
    for(const l of [1,2,3,4]) ids.push(...pick('p2',l,6));
    for(const l of [1,2,3,4]) ids.push(...sets(EAV,l,2));
    for(const l of [1,2,3,4]) ids.push(...pick('p5',l,6));
    for(const l of [1,2,3,4]) ids.push(...sets(INB,l,2));
  } else for(const t of ['p2','p5'])for(const l of [1,2,3,4])ids.push(...pick(t,l,5));

function startSets(type,n,level,showText){
  const p=me(), lv=level==='auto'?(p.level||1):level, arr=type==='eav'?EAV:INB;
  const fresh=s=>s.qids.filter(id=>!p.seen[id]).length;
  const order=[lv,lv-1,lv+1,lv-2,lv+2,lv-3,lv+3].filter(l=>l>=1&&l<=4);
  let chosen=[];
  for(const l of order){
    if(chosen.length>=n) break;
    const c=shuf(arr.filter(s=>s.l===l)).sort((a,b)=>fresh(b)-fresh(a));
    chosen.push(...c.slice(0,n-chosen.length));
  }
  startGame({mode:type,fixed:chosen.flatMap(s=>s.qids),level:lv,timer:0,showText0:!!showText,nsets:n,setLevel:level});
}

function pickVoices(){
  const lang=me().set.accent;
  const en=voices.filter(v=>v.lang&&v.lang.replace('_','-').startsWith(lang));
  const pool=en.length?en:voices.filter(v=>v.lang&&v.lang.startsWith('en'));
  const fem=/female|samantha|victoria|karen|moira|tessa|zira|susan|serena|fiona|kate|ava|allison|libby|sonia|jenny|aria|natasha|google us english$/i;
  const mal=/\bmale|daniel|alex|fred|david|mark|george|james|rishi|guy|ryan|aaron|arthur|oliver|thomas/i;
  const W=pool.find(v=>fem.test(v.name))||pool[0];
  const M=pool.find(v=>mal.test(v.name)&&v!==W)||pool.find(v=>v!==W)||W;
  return {W,M,A:W};
}
function playSet(){
  const s=G.q.set;
  if(!TTS){if(!G.showText){G.showText=true;renderQ();toast('อุปกรณ์นี้ไม่รองรับเสียง จึงแสดงบทแทน')}return}
  try{
    speechSynthesis.cancel();
    const vs=pickVoices(), p=me();
    s.lines.flatMap(([who,text])=>splitSentences(text).map(t=>[who,t])).forEach(([who,text])=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang=p.set.accent; u.rate=p.set.rate;
      const v=vs[who]||vs.A; if(v) u.voice=v;
      u.pitch=who==='W'?1.15:who==='M'?0.85:1; // keeps speakers distinct even when only one voice exists
      speechSynthesis.speak(u);
    });
  }catch(e){}
}

// ================= Speech recognition =================
const SRC=window.SpeechRecognition||window.webkitSpeechRecognition;
let srBlocked=false;
function canSR(){return !!SRC&&!srBlocked}
function micNote(){return canSR()?'<p class="xs mut" style="margin-top:10px">🎤 ระบบจะขออนุญาตใช้ไมโครโฟนเมื่อกดพูดครั้งแรก</p>':'<div class="note" style="margin-top:14px">อุปกรณ์/เบราว์เซอร์นี้ตรวจเสียงพูดไม่ได้ จะใช้โหมดพูดตามแล้วประเมินตัวเอง (ตรวจเสียงได้บน Chrome, Android และ Safari บน iPhone เมื่อเปิดจากเว็บจริง)</div>'}
const NUMW={zero:'0',one:'1',two:'2',three:'3',four:'4',five:'5',six:'6',seven:'7',eight:'8',nine:'9',ten:'10',eleven:'11',twelve:'12',thirteen:'13',fourteen:'14',fifteen:'15',sixteen:'16',seventeen:'17',eighteen:'18',nineteen:'19',twenty:'20',thirty:'30',forty:'40',fifty:'50',sixty:'60',seventy:'70',eighty:'80',ninety:'90',hundred:'100'};
function toks(s){return String(s).toLowerCase().replace(/(\d),(\d)/g,'$1$2').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').split(/\s+/).map(w=>w.replace(/^'+|'+$/g,'')).filter(Boolean).map(w=>NUMW[w]||w)}
function lcsHit(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  const hit=new Array(m).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}
  return hit;
}
function scoreText(target,alts){
  const t=toks(target); let best={pct:-1,hit:new Array(t.length).fill(false),heard:alts[0]||''};
  for(const a of alts){const hit=lcsHit(t,toks(a));const pct=Math.round(hit.filter(Boolean).length/Math.max(1,t.length)*100);if(pct>best.pct)best={pct,hit,heard:a}}
  best.pct=Math.max(0,best.pct); return best;
}
function markWords(target,hit){ // colour each displayed word by whether all its tokens were matched
  let k=0;
  return target.split(/\s+/).map(w=>{const n=toks(w).length;const ok=n===0||hit.slice(k,k+n).every(Boolean);k+=n;return `<span class="${ok?'w-hit':'w-miss'}">${esc(w)}</span>`}).join(' ');
}
function recognize(){
  return new Promise((res,rej)=>{
    let r; try{r=new SRC()}catch(e){rej('unsupported');return}
    r.lang=me().set.accent||'en-US'; r.interimResults=false; r.maxAlternatives=3; r.continuous=false;
    let got=false;
    r.onresult=e=>{got=true;res([...e.results[0]].map(x=>x.transcript))};
    r.onerror=e=>{got=true;rej(e.error||'error')};
    r.onend=()=>{if(!got)rej('no-speech')};
    try{r.start();A.rec=r}catch(e){rej('start-failed')}
  });
}
async function listenFor(onDone){
  if(!canSR()){toast('อุปกรณ์นี้ตรวจเสียงพูดไม่ได้');return}
  if(A.listening){try{A.rec&&A.rec.stop()}catch(e){}return}
  stopSpeak(); A.listening=true; renderA();
  try{const alts=await recognize(); A.listening=false; onDone(alts)}
  catch(err){
    A.listening=false;
    if(['not-allowed','service-not-allowed','unsupported','start-failed','audio-capture'].includes(err)){srBlocked=true;toast('ใช้ไมโครโฟนไม่ได้ จึงเปลี่ยนเป็นโหมดประเมินตัวเอง')}
    else toast('ไม่ได้ยินเสียง ลองกดแล้วพูดอีกครั้ง');
    if(A&&A.kind==='rp'&&!canSR()) A.mode='choose';
    renderA();
  }
}
function micBtn(handler,label){return `<button class="mic ${A.listening?'on':''}" onclick="${handler}" aria-label="พูด">${A.listening?'■':'🎤'}</button><div class="sm mut" style="text-align:center">${A.listening?'กำลังฟัง… พูดได้เลย (แตะเพื่อหยุด)':label}</div>`}

let A=null;
function recordAct(type,pass){const p=me();p.stats[type].a++;if(pass)p.stats[type].c++;const d=today();p.days[d]=(p.days[d]||0)+(pass?1:0);save(p)}
function quitA(){try{A&&A.rec&&A.rec.stop()}catch(e){}stopSpeak();A=null;flush();render()}
function progHead(i,n){return `<div class="top"><button class="x" onclick="quitA()">✕</button><div class="prog"><i style="width:${i/n*100}%"></i></div><span class="sm mut">${Math.min(i+1,n)}/${n}</span></div>`}
function renderA(){
  setTabs(false);
  if(A.done) return renderADone();
  $('#app').innerHTML={sh:vShadow,rp:vRP,sb:vSB,mt:vMT}[A.kind]();
  const inp=$('#dict'); if(inp&&!A.checked){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
}
function renderADone(){
  let h=`<div class="top"><span></span><button class="x" onclick="quitA()">✕</button></div>`;
  if(A.kind==='rp'){
    const n=A.results.filter(Boolean).length;
    h+=`<h1>${esc(A.sc.title)}</h1><div class="row" style="margin-top:14px"><div class="big">${n}<span class="mut" style="font-size:22px">/${A.results.length}</span></div><div class="mut sm" style="margin-left:6px">รอบที่ตอบได้เหมาะสม</div></div>
    <h2>บทสนทนา</h2>${chatLog()}
    <h2>ตัวอย่างคำตอบที่ดี</h2><div class="list">${A.sc.turns.map((t,i)=>`<div><div class="xs mut">${esc(t.goal)} ${A.results[i]?'<span style="color:var(--ok)">✓</span>':'<span style="color:var(--bad)">✗</span>'}</div><div class="sm" style="margin-top:2px">${esc(t.opts[0])}</div></div>`).join('')}</div>
    <div class="foot"><div class="row"><button class="btn" style="flex:1" onclick="startRP(${A.si})">เล่นอีกครั้ง</button><button class="btn pri" style="flex:1" onclick="A=null;openSetup('rp')">เลือกเรื่องอื่น</button></div></div>`;
  } else {
    const pass=A.res.filter(r=>r.ok).length;
    h+=`<h1>${{sh:'Shadowing',sb:'Sentence Builder',mt:'Message Taker'}[A.kind]}</h1>
    <div class="row" style="margin-top:14px;gap:24px"><div><div class="big">${pass}<span class="mut" style="font-size:22px">/${A.res.length}</span></div><div class="mut sm">${{sh:'ประโยคที่พูดได้ดี (70% ขึ้นไป)',sb:'ประโยคที่ถูกต้อง',mt:'ข้อความที่จดได้ 75% ขึ้นไป'}[A.kind]}</div></div></div>
    <h2>สรุปรายประโยค</h2><div class="list">${A.res.map((r,i)=>`<div class="row sp"><span class="sm"><b>${i+1}.</b> ${esc(r.text)}</span><span style="font-weight:700;color:${r.ok?'var(--ok)':'var(--bad)'}">${r.pct!==undefined&&!r.self?r.pct+'%':(r.ok?'✓':'✗')}</span></div>`).join('')}</div>
    <div class="foot"><div class="row"><button class="btn" style="flex:1" onclick="${{sh:'startShadow',sb:'startSB',mt:'startMT'}[A.kind]}(A.cfg)">เล่นอีกครั้ง</button><button class="btn pri" style="flex:1" onclick="quitA()">กลับหน้าหลัก</button></div></div>`;
  }
  $('#app').innerHTML=h; window.scrollTo(0,0);
}

// ---------- Shadowing ----------
function startShadow(cfg){
  const p=me(), lvl=cfg.level==='auto'?(p.level||1):cfg.level;
  const pool=shuf(SHL.filter(x=>x.level===lvl)).sort((a,b)=>((p.speak[a.id]||0)>=70)-((p.speak[b.id]||0)>=70));
  setup=null; A={kind:'sh',cfg,items:pool.slice(0,cfg.count),idx:0,mode:cfg.shMode,res:[],cur:null,tries:0};
  renderA(); speak([A.items[0].text]);
}
function shTry(){listenFor(alts=>{const r=scoreText(A.items[A.idx].text,alts);if(!A.cur||r.pct>=A.cur.pct)A.cur=r;else A.cur={...r,best:A.cur.pct};A.last=r;A.tries++;renderA()})}
function shSelf(ok){A.cur={pct:ok?100:40,self:true,hit:[]};A.last=A.cur;renderA()}
function shNext(){
  const it=A.items[A.idx], p=me(), sc=A.cur?A.cur.pct:0, ok=sc>=70;
  p.speak[it.id]=Math.max(p.speak[it.id]||0,sc); recordAct('sh',ok);
  A.res.push({text:it.text,pct:sc,ok,self:A.cur&&A.cur.self});
  A.idx++; A.cur=null; A.last=null; A.tries=0;
  if(A.idx>=A.items.length){A.done=true;renderA();return}
  renderA(); speak([A.items[A.idx].text]);
}
function vShadow(){
  const it=A.items[A.idx], show=A.mode==='text'||A.last;
  let h=progHead(A.idx,A.items.length)+`<div class="row sp"><span class="chip">พูด · Shadowing</span><span class="chip acc">${LV[it.level]}</span></div>`;
  h+=`<div class="card" style="margin-top:16px;text-align:center"><div class="sent">${show?(A.last&&!A.last.self?markWords(it.text,A.last.hit):esc(it.text)):'<span class="mut">ฟังให้ดีแล้วพูดตาม<br>(ข้อความจะแสดงหลังพูด)</span>'}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="speak([A.items[A.idx].text])">🔊 ฟัง</button><button class="btn" onclick="speak([A.items[A.idx].text],0.7)">🐢 ฟังช้า</button></div></div>`;
  if(canSR()){
    h+=`<div style="margin-top:18px">${micBtn('shTry()',A.tries?'แตะเพื่อพูดอีกครั้ง':'แตะแล้วพูดตามประโยค')}</div>`;
    if(A.last) h+=`<div class="exp ${A.last.pct>=70?'ok':'bad'}" style="margin-top:14px"><b>${A.last.pct}%</b> ${A.last.pct>=90?'ยอดเยี่ยม!':A.last.pct>=70?'ดีมาก':'ลองอีกครั้ง ฟังคำสีแดงให้ดี'}<div class="sm mut" style="margin-top:4px">ระบบได้ยิน: “${esc(A.last.heard)}”</div>${A.cur&&A.cur.pct>A.last.pct?`<div class="xs mut">คะแนนดีที่สุด ${A.cur.pct}%</div>`:''}</div>`;
  } else {
    h+=micNote()+(A.cur?`<div class="exp ${A.cur.pct>=70?'ok':'bad'}" style="margin-top:12px">${A.cur.pct>=70?'เยี่ยม! ไปประโยคต่อไปได้เลย':'ลองฟังช้าแล้วพูดตามอีกรอบก่อนไปต่อ'}</div>`:
      `<p class="sm" style="margin-top:14px;text-align:center">ฟังแล้วพูดตามออกเสียงดังๆ จากนั้นประเมินตัวเอง</p><div class="row" style="margin-top:10px"><button class="btn" style="flex:1" onclick="shSelf(false)">↻ ยังติดขัด</button><button class="btn" style="flex:1" onclick="shSelf(true)">✓ พูดได้คล่อง</button></div>`);
  }
  h+=`<div class="foot"><button class="btn ${A.cur?'pri':''} full" onclick="shNext()">${A.cur?(A.idx+1>=A.items.length?'ดูผล':'ประโยคต่อไป'):'ข้ามประโยคนี้'}</button></div>`;
  return h;
}

// ---------- Role-play ----------
function startRP(i){
  const sc=RP[i], st=setup||{rpMode:(A&&A.modePref)||'auto'};
  let mode=st.rpMode==='auto'?(sc.l<=2?'choose':'speak'):st.rpMode;
  if(mode==='speak'&&!canSR()) mode='choose';
  setup=null; A={kind:'rp',sc,si:i,t:0,mode,modePref:st.rpMode,log:[],results:[]};
  rpTurn();
}
function rpTurn(){const t=A.sc.turns[A.t];A.log.push({who:'npc',text:t.npc});A.opts=shuf(t.opts);A.stage='ask';A.cur=null;A.pick=null;A.hint=false;A.say=null;renderA();speak([t.npc]);window.scrollTo(0,document.body.scrollHeight)}
function rpChoose(i){if(A.stage!=='ask')return;A.pick=i;A.ok=A.opts[i]===A.sc.turns[A.t].opts[0];A.stage='chosen';renderA();if(A.ok)speak([A.opts[i]])}
function rpEval(turn,alts){
  let best=null;
  for(const a of alts){
    const txt=' '+toks(a).join(' ')+' ', raw=' '+a.toLowerCase()+' ';
    const matched=turn.kw.filter(g=>g.some(k=>txt.includes(toks(k).join(' '))||raw.includes(k.toLowerCase()))).length;
    const sim=scoreText(turn.opts[0],[a]).pct;
    const pass=matched===turn.kw.length||(turn.kw.length>1&&matched>=Math.ceil(turn.kw.length*0.67))||sim>=70;
    const r={heard:a,matched,total:turn.kw.length,sim,pass};
    if(!best||(r.pass&&!best.pass)||(r.pass===best.pass&&r.matched+r.sim/100>best.matched+best.sim/100)) best=r;
  }
  return best;
}
function rpSpeak(){listenFor(alts=>{A.cur=rpEval(A.sc.turns[A.t],alts);A.stage='spoken';renderA()})}
function rpSay(){listenFor(alts=>{A.say=scoreText(A.opts[A.pick],alts);renderA()})}
function rpNext(){
  const turn=A.sc.turns[A.t];
  const pass=A.mode==='choose'?!!A.ok:!!(A.cur&&A.cur.pass);
  A.results.push(pass); recordAct('rp',pass);
  A.log.push({who:'me',text:A.mode==='choose'?(A.pick!==null?A.opts[A.pick]:turn.opts[0]):(A.cur?A.cur.heard:turn.opts[0]),ok:pass});
  A.t++;
  if(A.t>=A.sc.turns.length){
    A.log.push({who:'npc',text:A.sc.end});
    const p=me(), n=A.results.filter(Boolean).length; p.rpBest[A.si]=Math.max(p.rpBest[A.si]||0,n); save(p);
    A.done=true; renderA(); speak([A.sc.end]); return;
  }
  rpTurn();
}
function chatLog(){return `<div>${A.log.map((m,i)=>`<div class="bub ${m.who}">${esc(m.text)}${m.who==='npc'&&i===A.log.length-1&&!A.done?` <button class="spk" style="width:30px;height:30px;font-size:14px;margin:0 0 0 6px;vertical-align:middle" onclick="speak([${JSON.stringify(m.text).replace(/"/g,'&quot;')}])">🔊</button>`:''}</div>`).join('')}</div>`}
function vRP(){
  const t=A.sc.turns[A.t], L=['A','B','C'];
  let h=`<div class="top"><button class="x" onclick="quitA()">✕</button><div class="prog"><i style="width:${A.t/A.sc.turns.length*100}%"></i></div><span class="sm mut">${A.t+1}/${A.sc.turns.length}</span></div>
  <div class="row"><span style="font-size:26px">${A.sc.ic}</span><div><b>${esc(A.sc.title)}</b><div class="xs mut">${esc(A.sc.role)}</div></div></div>
  <div style="margin-top:12px">${chatLog()}</div>
  <div class="goal">🎯 ภารกิจ: <b>${esc(t.goal)}</b></div>`;
  if(A.mode==='choose'){
    h+=A.opts.map((o,i)=>{let c='';if(A.stage==='chosen'){if(o===t.opts[0])c='ok';else if(i===A.pick)c='bad'}return `<button class="opt ${c}" onclick="rpChoose(${i})"><span class="k">${L[i]}</span><span>${esc(o)}</span></button>`}).join('');
    if(A.stage==='ask'&&canSR()) h+=`<button class="link" onclick="A.mode='speak';renderA()">เปลี่ยนเป็นพูดตอบเอง</button>`;
    if(A.stage==='chosen'){
      h+=`<div class="exp ${A.ok?'ok':'bad'}"><b>${A.ok?'เหมาะสม!':'ยังไม่เหมาะ'}</b> ${A.ok?'ลองพูดประโยคนี้ออกเสียงเพื่อฝึกด้วย':'คำตอบที่เหมาะคือ “'+esc(t.opts[0])+'”'}</div>`;
      if(A.ok&&canSR()) h+=`<div style="margin-top:10px">${micBtn('rpSay()','แตะแล้วพูดประโยคที่เลือก (ไม่บังคับ)')}</div>${A.say?`<p class="sm" style="text-align:center;margin-top:6px">ออกเสียงได้ <b>${A.say.pct}%</b> · ได้ยิน “${esc(A.say.heard)}”</p>`:''}`;
      h+=`<div class="foot"><button class="btn pri full" onclick="rpNext()">${A.t+1>=A.sc.turns.length?'จบบทสนทนา':'ต่อไป'}</button></div>`;
    }
  } else {
    if(A.stage==='ask'){
      h+=`<div style="margin-top:6px">${micBtn('rpSpeak()','แตะแล้วพูดตอบเป็นภาษาอังกฤษ')}</div>
      <div style="text-align:center;margin-top:8px">${A.hint?`<div class="note">ตัวอย่าง: “${esc(t.opts[0])}”</div>`:`<button class="link" onclick="A.hint=true;renderA()">ดูตัวอย่างคำตอบ</button>`} · <button class="link" onclick="A.mode='choose';renderA()">เปลี่ยนเป็นเลือกคำตอบ</button></div>`;
    } else {
      const c=A.cur;
      h+=`<div class="exp ${c.pass?'ok':'bad'}"><b>${c.pass?'สื่อสารได้ดี!':'ยังไม่ครบตามภารกิจ'}</b><div class="sm" style="margin-top:4px">คุณพูดว่า: “${esc(c.heard)}”</div><div class="sm mut" style="margin-top:4px">ตัวอย่างคำตอบ: “${esc(t.opts[0])}”</div></div>
      <div class="row" style="margin-top:12px"><button class="btn" style="flex:1" onclick="A.stage='ask';A.cur=null;renderA()">↻ พูดใหม่</button><button class="btn pri" style="flex:1" onclick="rpNext()">${A.t+1>=A.sc.turns.length?'จบบทสนทนา':'ต่อไป'}</button></div>`;
    }
  }
  return h;
}

// ---------- Sentence Builder ----------
function startSB(cfg){
  const p=me(), lvl=cfg.level==='auto'?(p.level||1):cfg.level;
  const pool=shuf(SBL.filter(x=>x.level===lvl)).sort((a,b)=>(p.seen[a.id]||0)-(p.seen[b.id]||0));
  setup=null; A={kind:'sb',cfg,items:pool.slice(0,cfg.count),idx:0,mode:cfg.sbMode,res:[]};
  sbInit(); renderA(); if(A.mode==='dict') speak([A.items[0].text]);
}
function sbInit(){
  const it=A.items[A.idx]; const words=it.text.split(/\s+/);
  let tiles; for(let k=0;k<6;k++){tiles=shuf(words.map((w,i)=>({w,i})));if(tiles.map(t=>t.w).join(' ')!==it.text)break}
  A.tiles=tiles; A.ans=[]; A.checked=false; A.ok=false; A.typed=''; A.cur=null;
}
function sbTap(k){if(A.checked||A.ans.includes(k))return;A.ans.push(k);renderA()}
function sbBack(pos){if(A.checked)return;A.ans.splice(pos,1);renderA()}
function sbCheck(){
  const it=A.items[A.idx], p=me();
  if(A.mode==='arrange'){
    const got=A.ans.map(k=>A.tiles[k].w).join(' ');
    A.ok=toks(got).join(' ')===toks(it.text).join(' ');
  } else {
    A.cur=scoreText(it.text,[A.typed]); A.ok=A.cur.pct>=90;
  }
  A.checked=true; p.seen[it.id]=(p.seen[it.id]||0)+1; recordAct('sb',A.ok);
  A.res.push({text:it.text,ok:A.ok,pct:A.mode==='dict'?A.cur.pct:undefined});
  renderA(); speak([it.text]);
}
function sbNext(){A.idx++;if(A.idx>=A.items.length){A.done=true;renderA();return}sbInit();renderA();if(A.mode==='dict')speak([A.items[A.idx].text])}
function vSB(){
  const it=A.items[A.idx], v=VOCAB[it.vi];
  let h=progHead(A.idx,A.items.length)+`<div class="row sp"><span class="chip">เขียน · ${A.mode==='arrange'?'เรียงคำ':'ฟังแล้วพิมพ์'}</span><span class="chip acc">${LV[it.level]}</span></div>
  <p class="sm mut" style="margin-top:12px">คำสำคัญ: <b style="color:var(--fg)">${esc(v[1])}</b> = ${esc(v[3])}</p>`;
  if(A.mode==='arrange'){
    h+=`<div class="ansbox">${A.ans.length?A.ans.map((k,pos)=>`<button class="tile" onclick="sbBack(${pos})">${esc(A.tiles[k].w)}</button>`).join(''):'<span class="mut sm" style="padding:8px">แตะคำด้านล่างเพื่อเรียงประโยค</span>'}</div>
    <div class="tiles">${A.tiles.map((t,k)=>`<button class="tile ${A.ans.includes(k)?'used':''}" onclick="sbTap(${k})">${esc(t.w)}</button>`).join('')}</div>`;
    if(!A.checked) h+=`<div class="foot"><div class="row"><button class="btn" style="flex:1" onclick="A.ans=[];renderA()">ล้าง</button><button class="btn pri" style="flex:2" ${A.ans.length===A.tiles.length?'':'disabled'} onclick="sbCheck()">ตรวจคำตอบ</button></div></div>`;
  } else {
    h+=`<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" onclick="speak([A.items[A.idx].text])">🔊 ฟัง</button><button class="btn" onclick="speak([A.items[A.idx].text],0.7)">🐢 ฟังช้า</button></div>
    <textarea id="dict" class="ta" rows="3" placeholder="พิมพ์ประโยคที่ได้ยิน" autocapitalize="off" autocomplete="off" spellcheck="false" ${A.checked?'disabled':''} oninput="A.typed=this.value">${esc(A.typed)}</textarea>`;
    if(!A.checked) h+=`<div class="foot"><button class="btn pri full" onclick="A.typed=$('#dict').value;if(!A.typed.trim()){toast('พิมพ์ประโยคที่ได้ยินก่อน');return}sbCheck()">ตรวจคำตอบ</button></div>`;
  }
  if(A.checked){
    h+=`<div class="exp ${A.ok?'ok':'bad'}" style="margin-top:14px"><b>${A.ok?'ถูกต้อง!':'ยังไม่ถูก'}</b>${A.mode==='dict'?` · ตรง ${A.cur.pct}%`:''}<div class="sent" style="font-size:17px;margin-top:6px">${A.mode==='dict'?markWords(it.text,A.cur.hit):esc(it.text)}</div></div>
    <div class="foot"><button class="btn pri full" onclick="sbNext()">${A.idx+1>=A.items.length?'ดูผล':'ประโยคต่อไป'}</button></div>`;
  }
  return h;
}

// ---------- Message Taker ----------
function normAns(s){return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function startMT(cfg){
  const p=me(), lvl=cfg.level==='auto'?(p.level||1):cfg.level;
  const order=[lvl,lvl-1,lvl+1,lvl-2,lvl+2,lvl-3,lvl+3].filter(l=>l>=1&&l<=4);
  let items=[];
  for(const l of order){ if(items.length>=cfg.count)break;
    items.push(...shuf(MT.map((m,i)=>({...m,id:'mt-'+i})).filter(m=>m.l===l)).sort((a,b)=>(p.seen[a.id]||0)-(p.seen[b.id]||0)).slice(0,cfg.count-items.length)); }
  setup=null; A={kind:'mt',cfg,items,idx:0,res:[]}; mtInit(); renderA(); mtPlay();
}
function mtInit(){const it=A.items[A.idx];A.vals=it.fields.map(()=>'');A.mcOpts=shuf(it.mc.slice(1,5));A.pick=null;A.checked=false;A.showTr=false}
function mtPlay(rate){speak([A.items[A.idx].text],rate)}
function mtCheck(){
  const it=A.items[A.idx], p=me();
  document.querySelectorAll('.mtf').forEach((el,i)=>A.vals[i]=el.value);
  if(A.pick===null){toast('เลือกคำตอบข้อสุดท้ายก่อน');return}
  A.fieldOk=it.fields.map((f,i)=>f[1].map(normAns).includes(normAns(A.vals[i])));
  A.mcOk=A.mcOpts[A.pick]===it.mc[1];
  const got=A.fieldOk.filter(Boolean).length+(A.mcOk?1:0), total=it.fields.length+1;
  A.score=Math.round(got/total*100); A.checked=true;
  p.seen[it.id]=(p.seen[it.id]||0)+1; recordAct('mt',A.score>=75);
  A.res.push({text:it.title,pct:A.score,ok:A.score>=75});
  renderA();
}
function mtNext(){A.idx++;if(A.idx>=A.items.length){A.done=true;renderA();return}mtInit();renderA();mtPlay()}
function vMT(){
  const it=A.items[A.idx], L=['A','B','C','D'];
  let h=progHead(A.idx,A.items.length)+`<div class="row sp"><span class="chip">ฟัง · ข้อความเสียง</span><span class="chip acc">${LV[it.l]}</span></div>
  <div class="listen" style="padding:16px"><div class="row" style="gap:14px;align-self:stretch"><button class="play" style="width:56px;height:56px;font-size:22px;flex:none" onclick="mtPlay()" aria-label="ฟัง">▶</button><div><b>📞 Voicemail</b><div class="xs mut">ฟังแล้วจดข้อมูลลงฟอร์มด้านล่าง</div></div><button class="btn" style="margin-left:auto;padding:10px 12px" onclick="mtPlay(0.7)">🐢</button></div>
  ${A.checked||A.showTr?`<div class="tr" style="text-align:left">${esc(it.text)}</div>`:''}</div>
  ${A.checked?'':`<button class="link" onclick="document.querySelectorAll('.mtf').forEach((el,i)=>A.vals[i]=el.value);A.showTr=!A.showTr;renderA()">${A.showTr?'ซ่อนบท':'แสดงบท (ตัวช่วย)'}</button>`}
  <div class="card" style="margin-top:12px"><b>📝 Phone message</b>`;
  it.fields.forEach((f,i)=>{
    const st=A.checked?(A.fieldOk[i]?'ok':'bad'):'';

function pinKey(k){
  const u=pinUI; if(!u||u.busy) return;
  if(u.lockUntil&&Date.now()<u.lockUntil){u.err='ใส่ผิดหลายครั้ง รอ '+Math.ceil((u.lockUntil-Date.now())/1000)+' วินาที';render();return}
  if(k==='del'){u.val=u.val.slice(0,-1);u.err='';render();return}
  if(u.val.length>=4) return;
  u.val+=k; u.err=''; render();
  if(u.val.length===4){u.busy=true;setTimeout(async()=>{const v=u.val;await u.cb(v);u.busy=false},120)}
}
function pinFail(msg){const u=pinUI;u.val='';u.fails=(u.fails||0)+1;u.err=msg;if(u.fails>=5){u.lockUntil=Date.now()+30000;u.fails=0;u.err='ใส่ผิด 5 ครั้ง กรุณารอ 30 วินาที'}render()}

      p.pinHash=await hashPin(p.id,v1); await done();
    }});
  }});
}

function vAuth(){
  const a=authUI, m=a.mode;
  if(recovery) return `<div style="padding-top:40px"><h1>ตั้งรหัสผ่านใหม่</h1>
    <div class="field"><label>รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)</label><input type="password" id="npw" autocomplete="new-password"></div>
    <div class="err" style="text-align:left;margin-top:8px">${esc(a.err)}</div>
    <button class="btn pri full" style="margin-top:10px" onclick="doRecover()">บันทึกรหัสผ่าน</button></div>`;
  return `<div style="padding-top:40px"><div style="font-size:36px">📘</div><h1 style="margin-top:8px">English Play</h1><p class="mut" style="margin-top:4px">ฝึกฟัง พูด อ่าน ภาษาอังกฤษสำหรับทั้งครอบครัว</p>
  <div class="seg" style="margin-top:24px"><button class="${m==='login'?'on':''}" onclick="authUI.mode='login';authUI.err='';render()">เข้าสู่ระบบ</button><button class="${m==='signup'?'on':''}" onclick="authUI.mode='signup';authUI.err='';render()">สร้างบัญชีครอบครัว</button></div>
  <div class="field"><label>อีเมล</label><input type="email" id="em" autocomplete="email" value="${esc(a.email||'')}"></div>
  ${m!=='reset'?`<div class="field"><label>รหัสผ่าน${m==='signup'?' (อย่างน้อย 8 ตัว)':''}</label><input type="password" id="pw" autocomplete="${m==='signup'?'new-password':'current-password'}"></div>`:''}
  <div class="err" style="text-align:left;margin-top:10px">${esc(a.err)}</div>
  ${a.msg?`<div class="note" style="margin-top:6px">${esc(a.msg)}</div>`:''}
  <button class="btn pri full" style="margin-top:12px" ${a.busy?'disabled':''} onclick="doAuth()">${{login:'เข้าสู่ระบบ',signup:'สร้างบัญชี',reset:'ส่งลิงก์ตั้งรหัสผ่านใหม่'}[m]}</button>
  ${m==='login'?`<div style="text-align:center;margin-top:16px"><button class="link" onclick="authUI.mode='reset';authUI.err='';render()">ลืมรหัสผ่าน?</button></div>`:''}
  ${m==='reset'?`<div style="text-align:center;margin-top:16px"><button class="link" onclick="authUI.mode='login';render()">กลับไปเข้าสู่ระบบ</button></div>`:''}
  ${m==='signup'?'<p class="xs mut" style="margin-top:14px">1 บัญชีใช้ร่วมกันทั้งครอบครัว แล้วสร้างโปรไฟล์สมาชิกพร้อม PIN ของแต่ละคนข้างใน</p>':''}</div>`;
}
async function doAuth(){
  const a=authUI, email=($('#em').value||'').trim(), pw=$('#pw')?$('#pw').value:'';
  a.email=email; a.err=''; a.msg='';
  if(!/^\S+@\S+\.\S+$/.test(email)){a.err='รูปแบบอีเมลไม่ถูกต้อง';render();return}
  if(a.mode!=='reset'&&pw.length<(a.mode==='signup'?8:1)){a.err=a.mode==='signup'?'รหัสผ่านต้องมีอย่างน้อย 8 ตัว':'กรุณาใส่รหัสผ่าน';render();return}
  a.busy=true; render();
  let res;
  if(a.mode==='login') res=await sb.auth.signInWithPassword({email,password:pw});
  else if(a.mode==='signup') res=await sb.auth.signUp({email,password:pw});
  else res=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  a.busy=false;
  if(res.error){a.err=thaiAuthError(res.error.message);render();return}
  if(a.mode==='signup'&&!res.data.session){a.msg='สร้างบัญชีแล้ว กรุณายืนยันอีเมลจากลิงก์ในกล่องจดหมาย แล้วกลับมาเข้าสู่ระบบ';a.mode='login'}
  if(a.mode==='reset'){a.msg='ถ้ามีบัญชีนี้ ระบบจะส่งลิงก์ไปที่อีเมล';a.mode='login'}
  render();
}
function thaiAuthError(m){
  if(/Invalid login/i.test(m)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
  if(/already registered|already exists/i.test(m)) return 'อีเมลนี้มีบัญชีอยู่แล้ว ลองเข้าสู่ระบบแทน';
  if(/not confirmed/i.test(m)) return 'ยังไม่ได้ยืนยันอีเมล กรุณากดลิงก์ในอีเมลก่อน';
  if(/not authorized|rate limit/i.test(m)) return 'ระบบส่งอีเมลไม่ได้ในตอนนี้ (ดูคู่มือหัวข้อการตั้งค่าอีเมล)';
  return m;
}
async function doRecover(){
  const pw=$('#npw').value; if(pw.length<8){authUI.err='รหัสผ่านต้องมีอย่างน้อย 8 ตัว';render();return}
  const {error}=await sb.auth.updateUser({password:pw});
  if(error){authUI.err=error.message;render();return}
  recovery=false; toast('เปลี่ยนรหัสผ่านแล้ว'); render();
}
async function logout(){await flush();setCur(null);S.profiles=[];G=null;A=null;setup=null;pinUI=null;await sb.auth.signOut();session=null;authUI={mode:'login',err:'',msg:'',busy:false,email:authUI.email};render()}

// ================= Render =================
function render(){
  if(booting){setTabs(false);$('#app').innerHTML='<div style="padding-top:120px;text-align:center" class="mut">กำลังโหลด…</div>';return}
  if(CLOUD&&(!session||recovery)){setTabs(false);$('#app').innerHTML=vAuth();return}
  if(pinUI){setTabs(false);$('#app').innerHTML=vPin();return}
  if(forgotUI){setTabs(false);$('#app').innerHTML=vForgot();return}
  if(A) return renderA();
  if(G) return renderQ();
  if(setup) return renderSetup();
  if(!me()){setTabs(false);$('#app').innerHTML=vProfiles();return}
  setTabs(true);
  $('#app').innerHTML={play:vPlay,review:vReview,exam:vExam,family:vFamily,me:vMe}[tab]();
}
async function boot(){
  if(!CLOUD){loadLocal();render();return}
  sb.auth.onAuthStateChange((ev,s)=>{
    // Supabase calls inside this callback can deadlock supabase-js, so do the work on the next tick
    setTimeout(async()=>{
      if(ev==='PASSWORD_RECOVERY'){recovery=true;session=s;render();return}
      const changed=(s&&s.user&&s.user.id)!==(session&&session.user&&session.user.id);
      session=s;
      if(changed&&!booting){if(s){await loadCloud()}else{S.profiles=[];setCur(null)}render()}
    },0);
  });
  const {data}=await sb.auth.getSession(); session=data.session;
  if(session) await loadCloud();
  booting=false; render();
}
boot();
</script>
</body>
</html>
